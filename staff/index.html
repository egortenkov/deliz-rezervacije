<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Deliz · Rezervacije</title>
  <script>
    /* tema pred prvim izrisom: ?theme=… → shranjena izbira → sistem */
    (function (d) {
      var p = 'system';
      try { p = new URLSearchParams(location.search).get('theme') || localStorage.getItem('deliz.theme.' + (location.pathname.indexOf('/staff') > -1 ? 'staff' : 'guest')) || 'system'; } catch (e) {}
      d.dataset.themePref = p;
      d.dataset.theme = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
    })(document.documentElement);
  </script>
  <meta name="theme-color" content="#0D0D0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Deliz">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../shared/ui/tokens.css">
  <link rel="stylesheet" href="staff.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <noscript>Aplikacija potrebuje JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
