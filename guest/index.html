<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deliz · Rezervacija mize</title>
  <meta name="description" content="Rezervirajte mizo v vinoteki Deliz.">
  <script>
    /* tema pred prvim izrisom: ?theme=… → shranjena izbira → sistem */
    (function (d) {
      var p = 'system';
      try { p = new URLSearchParams(location.search).get('theme') || localStorage.getItem('deliz.theme.' + (location.pathname.indexOf('/staff') > -1 ? 'staff' : 'guest')) || 'system'; } catch (e) {}
      d.dataset.themePref = p;
      d.dataset.theme = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
    })(document.documentElement);
  </script>
  <meta name="theme-color" content="#0D0D0D">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../staff/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../staff/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="../shared/ui/tokens.css">
  <link rel="stylesheet" href="guest.css">
</head>
<body>
  <main id="g" class="g"></main>
  <script type="module" src="guest.js"></script>
</body>
</html>
